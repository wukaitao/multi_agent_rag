[supervisord]
nodaemon=true
user=appuser
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:hermes-gateway]
# command=python -m uvicorn hermes.hermes_integration:gateway_app --host 0.0.0.0 --port 8001
command=python -m uvicorn app:gateway_app --host 0.0.0.0 --port 8001
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/hermes-gateway.log
environment=PYTHONPATH="/app"

[program:fastapi]
# command=python -m uvicorn hermes.hermes_integration:fastapi_app --host 0.0.0.0 --port 8000
command=python -m uvicorn app:fastapi_app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/fastapi.log

[program:streamlit]
command=streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/streamlit.log