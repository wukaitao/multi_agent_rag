version: '3.8'

services:
  agent:
    build: .
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8501:8501"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - CHROMA_PATH=/data/chroma
      - MEMORY_DB=/data/memory.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
      - ./logs:/var/log
    depends_on:
      - neo4j
      - chroma
    restart: unless-stopped
    networks:
      - agent-network

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    restart: unless-stopped
    networks:
      - agent-network
    
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8002:8000"
    volumes:
      - ./chroma/data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped
    networks:
      - agent-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - agent
    restart: unless-stopped
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
