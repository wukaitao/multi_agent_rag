# 定义后端服务
upstream fastapi {
    server agent:8000;
}

upstream gateway {
    server agent:8001;
}

upstream streamlit {
    server agent: 8501;
}

# HTTP 强制跳 HTTPS (可选, 如果你暂时不用 HTTPS 可以删除调这个 server 块)
# server {
#     listen 80;
#     server_name shturl.cc/I2ort;  # 换成你的域名或直接写 localhost
#     return 301 https://$server_name$request_uri;
# }

# HTTPS 服务
server {
    # listen 443 ssl http2;
    # server_name shturl.cc/I2ort;  # 换成你的域名或直接写 localhost

    # # SSL 证书路径(确保 ./ssl 目录下有这两个文件)
    # ssl_certficate /etc/nginx/ssl/cert.pem;
    # ssl_certficate_key /etc/nginx/ssl/key.pem;
    listen 80;
    server_name localhost;

    # Streamlit 前端(根路径)
    localhost / {
        proxy_pass http://streamlit/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $Host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded_Proto $scheme;
    }

    # FastAPI 接口(/api/ 路径)
    localhost /api/ {
        proxy_pass http://fastapi/;
        proxy_set_header Host $Host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded_Proto $scheme;
    }

    # Hermes Gateway (/gateway/ 路径)
    localhost /gateway/ {
        proxy_pass http://gateway/;
        proxy_set_header Host $Host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded_Proto $scheme;
    }
}